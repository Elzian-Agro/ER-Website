<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Decoder Single Modal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      #qrModal .logo {
        max-width: 100px;
        display: block;
        margin: 0 auto 15px;
      }

      #qrModal .certificate-body p {
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
      }

      #qrModal .certificate-body strong {
        width: 150px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <h3 class="mb-4">QR Code Decoder</h3>
      <input type="file" id="qrInput" accept="image/*" hidden />
      <button class="btn btn-success" onclick="triggerUpload()">Upload & Decode</button>
    </div>

    <!-- Single Modal -->
    <div class="modal fade" id="qrModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4 text-center" id="qrModalContent">
          <!-- Content injected via JS -->
        </div>
      </div>
    </div>

    <!-- Bootstrap & JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const qrInput = document.getElementById("qrInput");
      const qrModalEl = document.getElementById("qrModal");
      const qrModalContent = document.getElementById("qrModalContent");
      const qrModal = new bootstrap.Modal(qrModalEl);

      function triggerUpload() {
        qrInput.click();
      }

      qrInput.addEventListener("change", async function () {
        if (!this.files[0]) return;
        const file = this.files[0];

        // Show loading view in modal
        qrModalContent.innerHTML = `
        <div class="py-5">
          <div class="spinner-border text-success" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-3">Decoding QR Code...</p>
        </div>
      `;
        qrModal.show();

        try {
          const formData = new FormData();
          formData.append("file", file);

          const res = await fetch("https://api.qrserver.com/v1/read-qr-code/", {
            method: "POST",
            body: formData,
          });

          const json = await res.json();
          const data = json[0]?.symbol[0]?.data;

          if (!data || data === "No result") {
            showInvalidMessage();
            return;
          }

          const treeUnit = data.match(/LIfeForce Tree UNIT:\s*(.*)/i)?.[1];
          const plantedDate = data.match(/Planted Date:\s*(.*)/i)?.[1];
          const gpsLocation = data.match(/GPS Location:\s*(.*)/i)?.[1];
          const treeSpecies = data.match(/Tree\/Plant Species:\s*(.*)/i)?.[1];

          if (!treeUnit && !plantedDate && !gpsLocation && !treeSpecies) {
            showInvalidMessage();
          } else {
            qrModalContent.innerHTML = `
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/QR_code_example.svg/300px-QR_code_example.svg.png" class="logo" />
            <h5 class="text-success mb-3">LifeForce™ Token Certificate</h5>
            <div class="certificate-body text-start">
              <p><strong>Tree Unit:</strong> ${treeUnit || "Not found"}</p>
              <p><strong>Planted Date:</strong> ${plantedDate || "Not found"}</p>
              <p><strong>GPS Location:</strong> ${gpsLocation || "Not found"}</p>
              <p><strong>Species:</strong> ${treeSpecies || "Not found"}</p>
            </div>
            <button class="btn btn-secondary mt-4" data-bs-dismiss="modal">Close</button>
          `;
          }
        } catch (err) {
          showInvalidMessage();
        }
      });

      function showInvalidMessage() {
        qrModalContent.innerHTML = `
        <div class="py-5">
          <h5 class="text-danger mb-3">Token not valid</h5>
          <p class="text-muted">The QR code does not contain valid certification data.</p>
          <button class="btn btn-secondary mt-4" data-bs-dismiss="modal">Close</button>
        </div>
      `;
      }
    </script>
  </body>
</html>
