<!DOCTYPE html>
<html>
  <head>
    <title>QR Code Decoder Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      input[type="file"] {
        margin-bottom: 10px;
      }

      img {
        max-width: 200px;
        display: block;
        margin-top: 10px;
        border: 1px solid #ccc;
        padding: 5px;
        background-color: #f7f7f7;
      }

      .modal {
        display: none;
        position: fixed;
        z-index: 999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.6);
      }

      .modal-content {
        background-color: #fff;
        margin: 10% auto;
        padding: 20px;
        border: 1px solid #ccc;
        width: 80%;
        max-width: 500px;
        border-radius: 8px;
        position: relative;
      }

      .modal-content h2 {
        margin-top: 0;
      }

      .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        position: absolute;
        right: 15px;
        top: 10px;
        cursor: pointer;
      }

      .close:hover,
      .close:focus {
        color: black;
        text-decoration: none;
      }

      .styled-card {
        text-align: center;
        font-family: "Arial", sans-serif;
        color: #222;
      }

      .logo {
        max-width: 100px;
        margin: 0 auto 10px;
        display: block;
      }

      .title {
        font-size: 20px;
        color: #0a5c2c;
        margin-bottom: 20px;
      }

      .certificate-body p {
        margin: 6px 0;
        font-size: 12px;
        line-height: 1.4;
      }

      .certificate-body p strong {
        display: inline-block;
        width: 140px;
        text-align: right;
        margin-right: 10px;
        font-weight: 600;
        color: #000;
      }

      #qrPreview {
        display: none;
      }
    </style>
  </head>

    <script>
      const qrInput = document.getElementById("qrInput");
      const qrPreview = document.getElementById("qrPreview");
      const modal = document.getElementById("resultModal");
      const modalBody = document.getElementById("modalBody");
      let uploadedFile;

      qrInput.addEventListener("change", function () {
        if (this.files && this.files[0]) {
          uploadedFile = this.files[0];
          qrPreview.src = URL.createObjectURL(this.files[0]);
        }
        document.getElementById("qrPreview").style.display = "block";
      });

      function closeModal() {
        modal.style.display = "none";
        modalBody.innerHTML = "";
      }

      window.onclick = function (event) {
        if (event.target === modal) {
          closeModal();
        }
      };

      async function uploadAndDecode() {
        if (!uploadedFile) {
          alert("Please upload a QR image first.");
          return;
        }

        const qrServerData = new FormData();
        qrServerData.append("file", uploadedFile);

        const res = await fetch("https://api.qrserver.com/v1/read-qr-code/", {
          method: "POST",
          body: qrServerData,
        });

        const json = await res.json();
        const fullData = json[0]?.symbol[0]?.data || "No result";

        const nameMatch = fullData.match(/LIfeForce Tree UNIT:\s*(.*)/);
        const dateMatch = fullData.match(/Planted Date:\s*(.*)/);
        const gpsMatch = fullData.match(/GPS Location:\s*(.*)/);
        const treeMatch = fullData.match(/Tree\/Plant Species:\s*(.*)/);

        const treeUnit = nameMatch ? nameMatch[1].trim() : "Not found";
        const palntedDate = dateMatch ? dateMatch[1].trim() : "Not found";
        const gpsLocation = gpsMatch ? gpsMatch[1].trim() : "Not found";
        const treeSpecies = treeMatch ? treeMatch[1].trim() : "Not found";

        modalBody.innerHTML = `
          <p><strong>LIfeForce Tree UNIT:</strong> ${treeUnit}</p>
          <p><strong>Planted Date:</strong> ${palntedDate}</p>
          <p><strong>GPS Location:</strong> ${gpsLocation}</p>
          <p><strong>TreePlant Species:</strong> ${treeSpecies}</p>
        `;

        modal.style.display = "block";
      }
    </script>
