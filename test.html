<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="d-flex justify-content-end">
        <input type="file" id="qrInput" accept="image/*" hidden />
        <button class="btn btn-primary rounded-sm py-3 px-5 text-white" onclick="triggerUpload()">
            Check Validation
        </button>
    </div>

    <!-- QR Modal -->
    <div class="modal fade" id="qrModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 text-center position-relative" id="qrModalContent">
                <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"
                    aria-label="Close"></button>
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <script>
        const qrInput = document.getElementById("qrInput");
        const qrModalEl = document.getElementById("qrModal");
        const qrModalContent = document.getElementById("qrModalContent");
        const qrModal = new bootstrap.Modal(qrModalEl);

        function triggerUpload() {
            qrInput.click();
        }

        qrInput.addEventListener("change", async function () {
            if (!this.files[0]) return;
            const file = this.files[0];

            // Show loading view in modal
            qrModalContent.innerHTML = `
        <div class="py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-3">Validating Token...</p>
        </div>
      `;
            qrModal.show();

            try {
                const formData = new FormData();
                formData.append("file", file);

                const res = await fetch("https://api.qrserver.com/v1/read-qr-code/", {
                    method: "POST",
                    body: formData,
                });

                const json = await res.json();
                const data = json[0]?.symbol[0]?.data;

                if (!data || data === "No result") {
                    showInvalidMessage();
                    return;
                }

                const treeUnit = data.match(/LIfeForce Tree UNIT:\s*(.*)/i)?.[1];
                const plantedDate = data.match(/Planted Date:\s*(.*)/i)?.[1];
                const gpsLocation = data.match(/GPS Location:\s*(.*)/i)?.[1];
                const treeSpecies = data.match(/Tree\/Plant Species:\s*(.*)/i)?.[1];

                if (!treeUnit && !plantedDate && !gpsLocation && !treeSpecies) {
                    showInvalidMessage();
                } else {
                    qrModalContent.innerHTML = `
              <div class="position-relative">
                <button
                  type="button"
                  class="btn-close position-absolute top-0 end-0 m-3"
                  data-bs-dismiss="modal"
                  aria-label="Close">
                </button>

                <!-- Content -->
                <div class="text-center pt-5">
                  <img src="asset/img/logo.png" class="logo" style="width: 100px;"/>
                  <h5 class="text-muted mt-3">EarthRestoration</h5>
                  <h5 class="text-primary mb-3 mt-3">LifeForce™ Token Certificate</h5>
                  <div class="certificate-body text-start">
                    <p><strong>Tree Unit:</strong> ${treeUnit || "Not found"}</p>
                    <p><strong>Planted Date:</strong> ${plantedDate || "Not found"}</p>
                    <p><strong>GPS Location:</strong> ${gpsLocation || "Not found"}</p>
                    <p><strong>Species:</strong> ${treeSpecies || "Not found"}</p>
                  </div>
                   <div class="d-flex flex-wrap flex-column flex-sm-row gap-2">
                    <button class="btn btn-primary rounded-sm text-white">CTA</button>
                    <button class="btn btn-primary rounded-sm text-white">CTA</button>
                  </div>
                </div>
              </div>      
          `;
                }
            } catch (err) {
                showInvalidMessage();
            }
        });

        function showInvalidMessage() {
            qrModalContent.innerHTML = `
        <div class="py-5">
          <button
            type="button"
            class="btn-close position-absolute top-0 end-0 m-3"
            data-bs-dismiss="modal"
            aria-label="Close">
          </button>

          <img src="asset/img/logo.png" class="logo" style="width: 100px;"/>
          <h5 class="text-muted mt-3">EarthRestoration</h5>
          <h5 class="text-danger mb-3">Token not valid</h5>
          <p class="text-muted">add something add something.</p>
        </div>
      `;
        }
    </script>
</body>

</html>
